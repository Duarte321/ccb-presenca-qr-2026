name: Diagnóstico de build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar aplicação
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ljaidixtmsobijzwwrdw.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
